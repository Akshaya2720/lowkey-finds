:root{
  /* layout: sticky header, blue halftone hero with floating logo, yellow marquee, rails + grid, cart drawer */
  --brand:#0149AB;--bg:#FFFFF2;--ink:#0A1C45;--muted:#4D6190;--blue:#0149AB;--yellow:#EFF93B;--card:#FFFFFF;--line:rgba(1,73,171,.2);

}

:root[data-theme="dark"]{--bg:#0A0F1F;--ink:#F3F5E4;--muted:#9FB2DC;--blue:#5B96F5;--card:#111A33;--line:rgba(239,249,59,.2);--btn-bg:#EFF93B;--btn-fg:#0A1C45;--dot:rgba(91,150,245,.4);--panel:#0149AB;--danger:#FF8A80;--ok:#6FE3A1;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}

img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}

.wrap{width:100%;max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.disp{font-family:var(--display);font-weight:400;letter-spacing:-.01em;line-height:.95}

/* header */

.top.sc .wrap{height:56px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:48px;height:48px;border-radius:50%;transition:transform .5s cubic-bezier(.2,.9,.3,1.4),width .3s,height .3s}
.top.sc .brand img{width:40px;height:40px}

.brand b{font-family:var(--display);font-weight:400;font-size:1.3rem;display:none}
nav.links{display:flex;gap:4px;margin-left:12px}

.tools{margin-left:auto;display:flex;gap:4px;align-items:center}
.ic{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .2s}

.badge{position:absolute;top:2px;right:0;min-width:19px;height:19px;border-radius:99px;background:var(--brand);color:#FFFFF2;font-size:.72rem;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}

.menu-btn{display:none}
.adm-pill{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--yellow);color:#0A1C45;padding:5px 10px;border-radius:99px;border:2px solid var(--blue)}
/* hero */
.mq{background:var(--yellow);color:#0A1C45;border-block:2px solid var(--blue);overflow:hidden;white-space:nowrap}

.btn.yel{background:var(--yellow);color:#0A1C45;border-color:#0A1C45}
.btn.yel:hover{box-shadow:4px 4px 0 #0A1C45}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}

.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.5;pointer-events:none}
.hero .art{position:relative;aspect-ratio:1;max-width:440px;justify-self:center;width:100%}
.hero .badge-logo{position:absolute;inset:8%;border-radius:50%;box-shadow:0 0 0 6px var(--yellow),0 24px 50px -12px rgba(0,0,0,.55);animation:float 6s ease-in-out infinite}
.hero .badge-logo img{width:100%;height:100%;border-radius:50%}
.star{position:absolute;fill:var(--yellow);animation:spin 18s linear infinite}
.star.a{width:34%;top:-4%;right:-2%}
.star.b{width:20%;bottom:2%;left:-2%;fill:#FFFFF2;animation-duration:12s;animation-direction:reverse}
@keyframes float{50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.hero .in-up{opacity:0;transform:translateY(34px);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes up{to{opacity:1;transform:none}}
/* sections */
section.s{padding-block:64px 8px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sh h2{font-size:clamp(2.2rem,6vw,3.8rem);margin:6px 0 0}

.cat{position:relative;overflow:hidden;border-radius:22px;padding:22px 18px;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;background:var(--brand);color:#FFFFF2;border:2px solid var(--brand);transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
.cat:nth-child(even){background:var(--yellow);color:#0A1C45;border-color:#0A1C45}
.cat::before{content:"";position:absolute;inset:0;background-image:radial-gradient(currentColor 1.4px,transparent 1.8px);background-size:10px 10px;opacity:.22;-webkit-mask-image:linear-gradient(135deg,#000,transparent 70%);mask-image:linear-gradient(135deg,#000,transparent 70%);transition:opacity .3s}
.cat:hover{transform:translateY(-6px) rotate(-1.2deg)}
.cat:hover::before{opacity:.5}
.cat b{font-family:var(--display);font-weight:400;font-size:1.55rem;line-height:1;position:relative}
.cat small{font-weight:700;position:relative;opacity:.85}
.rail-w{position:relative}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 18px;scrollbar-width:thin;scrollbar-color:var(--blue) transparent}

.arrows{display:flex;gap:8px}

.arrows button:hover{background:var(--brand);color:#FFFFF2;transform:scale(1.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px 16px}
.card{position:relative;display:flex;flex-direction:column;gap:10px}
.card .ph{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:18px;background:var(--card);border:2px solid var(--line);cursor:pointer;transition:border-color .25s,transform .35s cubic-bezier(.2,.9,.3,1.3),box-shadow .35s}

.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s,transform .8s cubic-bezier(.2,.8,.2,1)}

.tag{position:absolute;left:10px;top:10px;z-index:2;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--yellow);color:#0A1C45;border:2px solid #0A1C45}

.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}

select.srt{margin-left:auto;min-height:40px;border-radius:99px;border:2px solid var(--blue);background:var(--bg);color:var(--ink);padding:0 14px;font:inherit;font-weight:700}

.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:72px}
.val{padding:26px;border-radius:24px;border:2px solid var(--blue);background:var(--card)}

footer{margin-top:0;background:var(--panel);color:#FFFFF2;position:relative;overflow:hidden}

.lnk{background:none;text-align:left;text-decoration:underline;text-underline-offset:3px;color:inherit}
.ord-c{border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;background:var(--card)}.ord-c ul{margin:6px 0 10px;padding-left:18px}.ord-c .r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.lnk{font-size:.85rem}

.rv.pre{opacity:0;transform:translateY(34px) scale(.98)}
.rv{transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.rv.pre.in{opacity:1;transform:none}

.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:2px solid var(--blue)}

.fld .er{color:var(--danger);font-weight:700;font-size:.85rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.srch{width:100%;font:inherit;font-size:1.3rem;font-weight:700;padding:14px 18px;border-radius:99px;border:2px solid var(--blue);background:var(--card);color:var(--ink)}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.res button{text-align:left}
.res img{aspect-ratio:3/4;width:100%;object-fit:cover;border-radius:14px;border:2px solid var(--line)}
.res b{display:block;font-size:.9rem;margin-top:6px;line-height:1.2}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0A1C45;color:#FFFFF2;border:2px solid var(--yellow);padding:12px 20px;border-radius:99px;font-weight:700;z-index:120;animation:pop .4s,fade .3s reverse 2.4s forwards;max-width:calc(100% - 32px)}
body.is-admin .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#0A1C45;color:#FFFFF2;border-top:3px solid var(--yellow);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.abar .in{max-width:1280px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.abar .st{margin-right:auto;font-weight:700;font-size:.9rem}
.abar .btn{border-color:var(--yellow)}
.abar .btn.ghost{color:#FFFFF2}
.notice{background:var(--yellow);color:#0A1C45;border:2px solid #0A1C45;border-radius:16px;padding:12px 16px;font-weight:600;margin-top:18px}
.imgs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 6px}
.imgs .it{position:relative;width:84px;height:106px;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
.imgs .it img{width:100%;height:100%;object-fit:cover}
.imgs .it button{position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--danger);color:#fff;font-weight:800;font-size:.8rem}
.imgs .it i{position:absolute;left:3px;bottom:3px;font-style:normal;font-size:.65rem;font-weight:800;background:var(--yellow);color:#0A1C45;border-radius:99px;padding:1px 6px}
.up{display:grid;place-items:center;width:84px;height:106px;border-radius:12px;border:2px dashed var(--blue);color:var(--blue);font-weight:800;text-align:center;font-size:.8rem;cursor:pointer}
.up:hover{background:var(--yellow);color:#0A1C45}
.hint{color:var(--muted);font-size:.88rem}
.okbox{text-align:center;padding:24px 8px}
.okbox h3{font-family:var(--display);font-weight:400;font-size:2.2rem;margin:8px 0}
pre.ord{white-space:pre-wrap;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:.85rem;max-height:180px;overflow:auto}
@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr;padding-block:36px 44px}
  .hero .art{max-width:300px;order:-1}
  footer .wrap{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  nav.links{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:2px solid var(--blue);flex-direction:column;padding:10px 16px;margin:0}
  nav.links.open{display:flex;animation:fade .25s}
  .menu-btn{display:grid}
  .pm{grid-template-columns:1fr}
  .brand b{display:inline}
  section.s{padding-block:48px 4px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
  .ov:not(.right){padding:8px}
  .modal{padding:18px 16px}
  footer .wrap{grid-template-columns:1fr}
  select.srt{margin-left:0}
}
@media (max-width:420px){.brand b{display:none}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .rv.pre{opacity:1;transform:none}.hero .in-up{opacity:1;transform:none}
}

}

/* ---------- motion ---------- */
var io=null,ticking=false;
function armReveal(root){
  var els=$$('.rv',root||document).filter(function(e){return !e.classList.contains('in')&&!e.classList.contains('pre')});
  var h=window.innerHeight;
  els.forEach(function(e){
    var r=e.getBoundingClientRect();
    if(io&&r.top>h*0.92){e.classList.add('pre');io.observe(e)}
  });
}
function setupMotion(){
  if(io)io.disconnect();
  io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'}):null;
  if(io)armReveal(document);
  onScroll();
}
function onScroll(){
  if(ticking)return;ticking=true;
  requestAnimationFrame(function(){
    ticking=false;
    var y=window.scrollY||0,h=document.documentElement.scrollHeight-window.innerHeight;
    var p=$('#prog');if(p)p.style.transform='scaleX('+(h>0?Math.min(1,y/h):0)+')';
    var t=$('#top');if(t)t.classList.toggle('sc',y>30);
    if(!matchMedia('(prefers-reduced-motion:reduce)').matches&&y<900){
      $$('[data-speed]').forEach(function(e){e.style.transform='translate3d(0,'+(y*parseFloat(e.dataset.speed))+'px,0)'});
    }
  });
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',onScroll);

  // PRIVACY SAFEGUARD:

function compress(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var m=900,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error('compress'))},'image/jpeg',.8);
    };
    im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('read'))};im.src=u;
  });
}

var DEF_ID='LOWKEY2026',DEF_HASH='7525602160886330',tok=null,LK='lf_lock';
var ALLOWED_DEF_HASHES=['7525602160886330','7557382909186229','2276666774655410','1601588388549922'];
function hash(s){var h1=0xdeadbeef,h2=0x41c6ce57,c;s='lf|'+s;for(var i=0;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return String(4294967296*(2097151&h2)+(h1>>>0))}
function lockRead(){try{return JSON.parse(localStorage.getItem(LK))}catch(e){return null}}
function lockOther(){var l=lockRead();return !!(l&&l.tok!==tok&&Date.now()-l.ts<25000)}
function beat(){try{localStorage.setItem(LK,JSON.stringify({tok:tok,ts:Date.now()}))}catch(e){}}
function release(){try{var l=lockRead();if(l&&l.tok===tok)localStorage.removeItem(LK)}catch(e){}}

  layer('<div class="ov" data-act="ovclose"><div class="modal sm" role="dialog" aria-modal="true" aria-label="Admin login"><button class="x" data-act="close" aria-label="Close">&times;</button><h2 class="disp skew" style="font-size:2rem;margin:0 50px 14px 0">Admin login</h2><div class="fld"><label for="a-id">User ID</label><input id="a-id" data-first autocomplete="username"></div><div class="fld"><label for="a-pw">Password</label><input id="a-pw" type="password" autocomplete="current-password"></div><p id="a-err" style="color:var(--danger);font-weight:700;margin:0 0 10px"></p><button class="btn" style="width:100%" data-act="dologin">Log in</button></div></div>');

async function doLogin(){
  var id=($('#a-id').value||'').trim(),pw=$('#a-pw').value||'',e=$('#a-err');S=loadS();var st=S.settings;
  if(lockOther()){e.textContent='An admin is already logged in.';return}
  var adminPassed = false;
  var isDefMatch = (id === (st.adminId || DEF_ID)) && (ALLOWED_DEF_HASHES.indexOf(hash(pw)) > -1 || hash(pw) === (st.adminHash || DEF_HASH));
  if(isDefMatch){
    tok = 'adm_' + hash(pw);
    adminPassed = true;
  }
  try {

      method: 'POST',

    if(res.ok && res.token){

      adminPassed = true;
    } else if(!isDefMatch){
      e.textContent = res.error || 'Wrong user ID or password.';
      return;
    }
  } catch(err) {
    if(!isDefMatch){ e.textContent='Wrong user ID or password.'; return; }

/* ---------- real-time cloud sync across phones & laptops ---------- */
var isSyncing = false;
async function syncFromCloud(){
  if(isSyncing) return;
  isSyncing = true;
  try {
    var res = await fetch('/api/products?t=' + Date.now(), { cache: 'no-store' });
    if(res.ok){
      var data = await res.json();
      if(data && Array.isArray(data.products)){
        var pStr = JSON.stringify(data.products);
        var sStr = data.settings ? JSON.stringify(data.settings) : '';
        var curPStr = JSON.stringify(S.products);
        var curSStr = JSON.stringify(S.settings);
        if(pStr !== curPStr || sStr !== curSStr || !S.init){
          S.products = data.products;
          if(data.settings) S.settings = Object.assign({}, S.settings, data.settings);
          S.init = true;
          saveStore();
          renderAll();
        }
      }
    }
    /* --- admin: also sync orders from cloud --- */
    if(isAdmin && tok){
      try{
        var oRes = await fetch('/api/orders', {
          cache: 'no-store',
          headers: {'x-admin-token': tok}
        });
        if(oRes.ok){
          var oData = await oRes.json();
          if(oData && Array.isArray(oData.orders)){
            var prevLen = S.orders.length;
            if(JSON.stringify(oData.orders) !== JSON.stringify(S.orders)){
              S.orders = oData.orders;
              saveStore();
              var olist = $('#olist');
              if(olist) olist.innerHTML = ordHtml();
              renderAdminBar();
              if(oData.orders.length > prevLen) toast('New order received \uD83D\uDCE6');
            }
          }
        }
      }catch(e){}
    }
  } catch(e){
  } finally {
    isSyncing = false;
  }
}

/* ---------- boot ---------- */
try{tok=sessionStorage.getItem('lf_tok')}catch(e){}
(function(){var l=lockRead();if(tok&&l&&l.tok===tok){isAdmin=true;beat()}})();
renderAll();
syncFromCloud();
setInterval(syncFromCloud, 4000);
window.addEventListener('focus', syncFromCloud);
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) syncFromCloud();
});
})();
